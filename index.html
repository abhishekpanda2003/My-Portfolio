<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Abhishek Panda — Portfolio</title>
    <meta
      name="description"
      content="Abhishek Panda — I build modern, responsive websites for small businesses and professionals. Portfolio sites, landing pages, and React applications."
    />

    <!-- Brand assets live in public/ and are copied to the build root.
         Vite rewrites these paths for the configured base, so they work
         from a root domain and from a subdirectory alike. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- matches C.bg in src/theme.js — tints mobile browser chrome -->
    <meta name="theme-color" content="#0A0F1A" />

    <!-- Link previews (Slack, WhatsApp, LinkedIn, X).
         og:image should be an ABSOLUTE url once the domain is settled —
         most scrapers will not resolve a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abhishek Panda — Portfolio" />
    <meta
      property="og:description"
      content="I build modern, responsive websites for small businesses and professionals."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Abhishek Panda — Portfolio" />
    <meta
      name="twitter:description"
      content="I build modern, responsive websites for small businesses and professionals."
    />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
